name: Daily Academic Triage & Feed Ingestion

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST / 2:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: resin-triage/package-lock.json

      - name: Install Dependencies
        working-directory: ./resin-triage
        run: npm ci

      - name: Ingest RSS Feeds & Curate Daily Triage
        working-directory: ./resin-triage
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
        run: npm run all
